<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIMA Invoice Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="media-controls.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar no-print">
      <header class="app-brand"><div class="brand-icon">P</div><div><strong>PIMA Invoice</strong><span>Generator</span></div></header>
      <div class="progress"><span style="width:72%"></span></div>
      <nav class="tabs" aria-label="Bagian form">
        <button class="tab active" data-tab="company">Perusahaan</button><button class="tab" data-tab="invoice">Invoice</button><button class="tab" data-tab="client">Klien</button><button class="tab" data-tab="products">Produk</button>
      </nav>
      <form id="invoiceForm">
        <section class="form-panel active" data-panel="company">
          <div class="panel-heading"><span>01</span><div><h2>Informasi Perusahaan</h2><p>Identitas penerbit invoice</p></div></div>
          <label class="logo-upload">Logo perusahaan<input id="logoInput" type="file" accept="image/*"><span>Unggah logo</span><small>PNG/JPG, maks. 2 MB</small></label>
          <label class="size-control">Ukuran logo <output id="logoSizeOutput">145 px</output><input id="logoSize" type="range" min="70" max="220" value="145"></label>
          <div class="media-fields">
            <div><label class="logo-upload compact">Stempel perusahaan<input id="stampInput" type="file" accept="image/*"><span>Unggah stempel</span><small>PNG transparan disarankan</small></label><label class="size-control">Ukuran stempel <output id="stampSizeOutput">86 px</output><input id="stampSize" type="range" min="45" max="150" value="86"></label></div>
            <div><label class="logo-upload compact">Tanda tangan<input id="signatureInput" type="file" accept="image/*"><span>Unggah tanda tangan</span><small>PNG transparan disarankan</small></label><label class="size-control">Ukuran tanda tangan <output id="signatureSizeOutput">105 px</output><input id="signatureSize" type="range" min="50" max="170" value="105"></label></div>
          </div>
          <label>Nama Perusahaan<input data-bind="company" value="PT PIMA KIMAGRO SEJAHTERA"></label>
          <label>Tagline<input data-bind="tagline" value="DISTRIBUTOR CHEMICAL & AGRICULTURAL PRODUCTS"></label>
          <label>Alamat<textarea data-bind="companyAddress">Jl. Raya Industri No. 88, Kawasan Industri Cikarang, Bekasi, Jawa Barat 17530, Indonesia</textarea></label>
          <div class="fields-2"><label>Telepon<input data-bind="phone" value="+62 812 3456 7890"></label><label>Email<input data-bind="email" value="info@pimakimagro.com"></label></div>
          <label>Website<input data-bind="website" value="www.pimakimagro.com"></label>
          <h3>Informasi Bank</h3>
          <div class="fields-2"><label>Bank<input data-bind="bank" value="BCA"></label><label>No. Rekening<input data-bind="account" value="1234 5678 901"></label></div>
          <label>Atas Nama<input data-bind="accountName" value="PT PIMA KIMAGRO SEJAHTERA"></label>
        </section>
        <section class="form-panel" data-panel="invoice">
          <div class="panel-heading"><span>02</span><div><h2>Detail Invoice</h2><p>Nomor, tanggal, dan pembayaran</p></div></div>
          <label>Headline Dokumen<input data-bind="invoiceTitle" value="INVOICE" placeholder="Contoh: INVOICE atau FAKTUR"></label>
          <label>Nomor Invoice<input class="mono" data-bind="invoiceNo" value="INV-260619-001"></label>
          <div class="fields-2"><label>Tanggal Invoice<input data-bind="invoiceDate" type="date" value="2026-06-19"></label><label>Jatuh Tempo<input data-bind="dueDate" type="date" value="2026-07-03"></label></div>
          <div class="fields-2"><label>Metode Pembayaran<select data-bind="paymentMethod"><option>Transfer Bank</option><option>Tunai</option><option>QRIS</option></select></label><label>Mata Uang<select data-bind="currency"><option>IDR</option><option>USD</option></select></label></div>
          <label>No. PO<input data-bind="po" value="PO/0619/2026"></label><label>Sales / Marketing<input data-bind="sales" value="Marketing Team"></label><label>Pengiriman<input data-bind="shippingMethod" value="Via Ekspedisi Darat"></label><label>Syarat Pembayaran<input data-bind="terms" value="Net 14 Hari"></label>
          <label class="toggle-row"><input id="taxToggle" type="checkbox" checked><span class="switch"></span><b>Gunakan PPN</b><input id="taxRate" class="tax-field" type="number" value="11" min="0" max="100">%</label>
        </section>
        <section class="form-panel" data-panel="client">
          <div class="panel-heading"><span>03</span><div><h2>Informasi Klien</h2><p>Penagihan dan pengiriman</p></div></div>
          <label>Judul Bagian Penagihan<input data-bind="billingLabel" value="DITAGIHKAN KEPADA" placeholder="Contoh: KEPADA YTH."></label>
          <label>Nama PT / Klien Penagihan<input data-bind="client" value="PT MAJU JAYA AGRINDO"></label>
          <label>Alamat Penagihan<textarea data-bind="billingAddress">Jl. Tani Makmur No. 10, Sidoarjo, Jawa Timur 61234, Indonesia</textarea></label>
          <label>Email<input data-bind="clientEmail" value="purchasing@majujaya.com"></label><label>Telepon<input data-bind="clientPhone" value="+62 31 1234 5678"></label>
          <label class="check-row"><input id="sameAddress" type="checkbox" checked> Alamat pengiriman sama dengan penagihan</label>
          <label>Nama PT / Klien Pengiriman<input data-bind="shippingClient" value="PT MAJU JAYA AGRINDO"></label>
          <label>Alamat Pengiriman<textarea data-bind="shippingAddress">Jl. Tani Makmur No. 10, Sidoarjo, Jawa Timur 61234, Indonesia</textarea></label>
          <label>Lokasi / Gudang<input data-bind="warehouse" value="Gudang Pusat"></label>
        </section>
        <section class="form-panel" data-panel="products">
          <div class="panel-heading"><span>04</span><div><h2>Produk & Catatan</h2><p>Rincian barang invoice</p></div></div>
          <div id="productEditor"></div><button id="addProduct" class="add-btn" type="button">＋ Tambah Produk</button>
          <label>Catatan<textarea data-bind="notes">Mohon melakukan pembayaran sesuai dengan jumlah total invoice.
Pembayaran dianggap sah setelah dana diterima di rekening kami.
Terima kasih atas kepercayaan dan kerjasamanya.</textarea></label>
        </section>
      </form>
      <footer class="sidebar-actions"><button id="saveBtn" class="secondary" type="button">Simpan Draft</button><button id="printBtn" class="primary" type="button">Cetak / PDF</button></footer>
    </aside>
    <main class="workspace">
      <div class="toolbar no-print"><div><span class="eyebrow">LIVE PREVIEW</span><h1>Invoice Anda</h1></div><div class="zoom"><button id="zoomOut">−</button><span id="zoomLabel">80%</span><button id="zoomIn">＋</button></div></div>
      <div class="paper-stage"><article id="invoice" class="invoice-container"></article></div>
    </main>
  </div>
  <div id="toast" role="status">Draft berhasil disimpan</div>
  <script src="app.js"></script>
</body>
</html>
